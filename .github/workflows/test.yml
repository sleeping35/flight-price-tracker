name: 測試

on:
  push:
    branches: [main]
    paths-ignore: ["docs/data/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - name: 單元測試（不呼叫外部 API）
        run: python -m pytest -q
      - name: 檢查設定檔
        run: python -m tracker regions
