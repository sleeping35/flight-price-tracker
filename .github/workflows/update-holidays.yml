name: 更新假日資料

on:
  schedule:
    # 人事總處通常在年中公告隔年辦公日曆：每年 7/1 與 12/1 台灣時間 09:23 各檢查一次
    - cron: "23 1 1 7,12 *"
  workflow_dispatch:
    inputs:
      year:
        description: "西元年（空白 = 今年與明年）"
        required: false
        default: ""
      url:
        description: "（選填）直接指定 CSV 下載網址，需同時填年份"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  holidays:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安裝套件
        run: pip install -r requirements.txt

      - name: 下載並轉檔
        env:
          INPUT_YEAR: ${{ inputs.year }}
          INPUT_URL: ${{ inputs.url }}
        run: |
          args=(holidays)
          if [ -n "$INPUT_YEAR" ]; then args+=(--year "$INPUT_YEAR"); fi
          if [ -n "$INPUT_URL" ]; then args+=(--url "$INPUT_URL"); fi
          python -m tracker "${args[@]}"

      - name: Commit 資料
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/holidays
          if git diff --cached --quiet; then
            echo "假日資料沒有變動"
            exit 0
          fi
          git commit -m "data: 更新假日資料"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 5))
          done
          exit 1
