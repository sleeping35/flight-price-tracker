name: 更新地區清單

# config/regions.yaml 有修改時，自動產生網頁用的 docs/data/regions.json
on:
  push:
    branches: [main]
    paths: ["config/regions.yaml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  regions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 產生 regions.json（格式錯誤時會在這裡失敗）
        run: python -m tracker regions
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/regions.json
          if git diff --cached --quiet; then echo "沒有變動"; exit 0; fi
          git commit -m "data: 更新地區清單"
          git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"
