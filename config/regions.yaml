# 地區對照表：國家 → 地區 → 機場代碼（IATA）
#
# 新增國家或地區的方式：
#   1. 照下面的格式加一段。國家 key 與地區 key 只能用小寫英文、數字與連字號，
#      地區 key 在整份檔案中不能重複（建議用「國家-地區」命名）。
#   2. 在 config/watchlist.yaml 的 watches 加上該地區 key，Actions 才會去抓價。
#   3. push 後到 Actions 手動執行「抓取機票價格」，網頁的下拉選單會自動出現新地區。

japan:
  name: 日本
  regions:
    japan-kanto:
      name: 關東（東京）
      airports: [NRT, HND]
    japan-kansai:
      name: 關西（大阪）
      airports: [KIX, UKB]
    japan-hokkaido:
      name: 北海道
      airports: [CTS, HKD]
    japan-kyushu:
      name: 九州
      airports: [FUK, KMJ, KOJ]

korea:
  name: 韓國
  regions:
    korea-seoul:
      name: 首爾
      airports: [ICN, GMP]
    korea-busan:
      name: 釜山
      airports: [PUS]
    korea-jeju:
      name: 濟州
      airports: [CJU]

china:
  name: 中國
  regions:
    china-shanghai:
      name: 上海
      airports: [PVG, SHA]
    china-hongkong:
      name: 香港
      airports: [HKG]

thailand:
  name: 泰國
  regions:
    thailand-bangkok:
      name: 曼谷
      airports: [BKK, DMK]
