<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>機票日期規劃</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <h1>機票日期規劃</h1>
    <p class="muted">依假日與請假天數找出最划算的出發日期，再一鍵到 Google Flights 查即時價格。</p>
  </header>

  <main>
    <form id="filters" class="panel" autocomplete="off">
      <div class="grid">
        <label class="field">
          <span class="label">出發地</span>
          <select name="origin">
            <option value="TPE">TPE 桃園</option>
            <option value="TSA">TSA 松山</option>
            <option value="KHH">KHH 高雄</option>
          </select>
        </label>

        <label class="field span-2">
          <span class="label">目的地</span>
          <select name="dest"></select>
        </label>

        <label class="field">
          <span class="label">票種</span>
          <select name="type">
            <option value="rt">來回</option>
            <option value="ow">單程</option>
          </select>
        </label>

        <div class="field span-2">
          <span class="label">出發日期</span>
          <div class="pair">
            <input type="date" name="from" aria-label="最早出發日">
            <span class="sep">～</span>
            <input type="date" name="to" aria-label="最晚出發日">
          </div>
          <div class="months" id="months" aria-label="快速選擇月份"></div>
        </div>

        <div class="field rt-only">
          <span class="label">旅遊天數</span>
          <div class="pair">
            <select name="dmin" aria-label="最少天數"></select>
            <span class="sep">～</span>
            <select name="dmax" aria-label="最多天數"></select>
          </div>
        </div>

        <label class="field rt-only">
          <span class="label">最多請假</span>
          <select name="maxleave">
            <option value="">不限</option>
            <option value="0">0 天</option>
            <option value="0.5">0.5 天</option>
            <option value="1">1 天</option>
            <option value="1.5">1.5 天</option>
            <option value="2">2 天</option>
            <option value="3">3 天</option>
            <option value="4">4 天</option>
            <option value="5">5 天</option>
          </select>
        </label>

        <label class="field span-2 rt-only">
          <span class="label">假日模式</span>
          <select name="mode">
            <option value="any">不限</option>
            <option value="weekend">含週末（包含週六與週日）</option>
            <option value="holiday">含國定連假（包含整個連假）</option>
            <option value="leave" selected>最少請假（依請假換連休排序）</option>
          </select>
        </label>

        <div class="field span-2 checks">
          <label class="check"><input type="checkbox" name="direct"> 只查直飛</label>
          <label class="check rt-only"><input type="checkbox" name="half"> 去回程日算半天假</label>
        </div>
      </div>

      <div class="actions">
        <button type="submit" class="primary">查詢</button>
        <button type="button" class="ghost" id="reset">重設條件</button>
        <span id="dirty" class="muted small" hidden>條件已變更，按「查詢」更新結果</span>
      </div>
    </form>

    <p id="notice" class="notice" hidden></p>

    <div class="bar">
      <p id="count" class="count"></p>
      <label class="sort">
        <span>排序</span>
        <select name="sort" form="filters">
          <option value="ratio" class="rt-only" selected>每請一天假換最多連休</option>
          <option value="leave" class="rt-only">請假天數少到多</option>
          <option value="rest" class="rt-only">連休天數多到少</option>
          <option value="dep">出發日早到晚</option>
        </select>
      </label>
    </div>

    <div class="table-wrap">
      <table id="results">
        <thead>
          <tr>
            <th>去程</th><th>回程</th><th class="num">天數</th><th class="num">請假</th><th class="num">連休</th><th>假日</th><th>查價（Google Flights）</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </main>

  <footer class="muted small">
    <p id="meta">載入資料中…</p>
    <p>假日依行政院人事行政總處「行政機關辦公日曆表」，含補班日。請假天數＝行程中的上班日；連休天數＝行程加上緊接在前後的放假日。</p>
    <p>想要降價通知：在 Google Flights 查詢結果頁打開「追蹤價格」，價格變動時 Google 會寄信通知。</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
